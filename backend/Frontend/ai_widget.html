<!-- AI CHAT WIDGET - Shows on all pages -->
<div id="ai-chat-btn" style="position:fixed;bottom:20px;right:20px;background:black;color:white;width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:9999;font-size:24px;">💬</div>

<div id="ai-chat-box" style="position:fixed;bottom:90px;right:20px;width:350px;max-width:90vw;height:450px;background:white;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,0.2);display:none;flex-direction:column;z-index:9999;overflow:hidden;">
  <div style="background:black;color:white;padding:14px;font-weight:bold;display:flex;justify-content:space-between;">
    <span>ShopByGold AI</span>
    <span id="ai-chat-close" style="cursor:pointer;">✕</span>
  </div>
  <div id="ai-chat-messages" style="flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;"></div>
  <div style="padding:10px;border-top:1px solid #eee;display:flex;gap:8px;">
    <input id="ai-chat-input" placeholder="Ask about cart, delivery..." style="flex:1;padding:10px;border:1px solid #ddd;border-radius:20px;outline:none;">
    <button id="ai-chat-send" style="background:black;color:white;border:none;padding:10px 16px;border-radius:20px;cursor:pointer;">Send</button>
  </div>
</div>

<script>
(function(){
  const chatBtn = document.getElementById('ai-chat-btn');
  const chatBox = document.getElementById('ai-chat-box');
  const closeBtn = document.getElementById('ai-chat-close');
  const messagesDiv = document.getElementById('ai-chat-messages');
  const chatInput = document.getElementById('ai-chat-input');
  const chatSendBtn = document.getElementById('ai-chat-send');

  let hasGreeted = false;
  function showWelcome(){
    if(hasGreeted) return;
    hasGreeted = true;
    messagesDiv.innerHTML += `<div style="background:#f1f1f1;padding:10px 12px;border-radius:12px;margin:8px 0;max-width:85%;width:fit-content;">Hello! 👋 How can I help you today?<br><br>• Track your order<br>• Delivery info<br>• Product recommendations</div>`;
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

  chatBtn.onclick = () => { 
    const isHidden = chatBox.style.display !== 'flex';
    chatBox.style.display = isHidden ? 'flex' : 'none';
    if(isHidden) showWelcome();
  }
  closeBtn.onclick = () => { chatBox.style.display = 'none'; }

  async function getToken() {
    return localStorage.getItem('access_token') || localStorage.getItem('token') || localStorage.getItem('jwt') || sessionStorage.getItem('access_token') || '';
  }

  async function sendChat() {
    const text = chatInput.value.trim();
    if(!text) return;
    messagesDiv.innerHTML += `<div style="background:black;color:white;padding:8px 12px;border-radius:12px;margin:8px 0;margin-left:auto;max-width:80%;width:fit-content;">${text}</div>`;
    chatInput.value = '';
    let token = await getToken();
    const headers = {'Content-Type': 'application/json'};
    if(token) headers['Authorization'] = 'Bearer ' + token;
    const res = await fetch('/api/ai-chat', { method: 'POST', headers: headers, body: JSON.stringify({ message: text }) });
    const data = await res.json();
    messagesDiv.innerHTML += `<div style="background:#f1f1f1;padding:8px 12px;border-radius:12px;margin:8px 0;max-width:80%;">${data.reply}</div>`;
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

  chatSendBtn.onclick = sendChat;
  chatInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') sendChat(); });

  // Abandoned cart check - same logic, works on ALL pages
  setInterval(async () => {
    try {
      let token = await getToken();
      if(!token) return; // only for logged in
      const headers = {'Content-Type': 'application/json'};
      headers['Authorization'] = 'Bearer ' + token;
      const res = await fetch('/api/ai-cart/check', { method: 'POST', headers: headers });
      const data = await res.json();
      console.log("Check abandoned:", data);
      if(data.abandoned) {
        chatBox.style.display = 'flex';
        messagesDiv.innerHTML += `<div style="background:#fff3cd;padding:10px 12px;border-radius:12px;margin:8px 0;max-width:85%;border:1px solid #ffc107;">${data.message}<br><br><button onclick="window.location.href='/cart'" style="background:black;color:white;border:none;padding:8px 14px;border-radius:8px;cursor:pointer;">Checkout Now</button></div>`;
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      }
    } catch(e) { console.log(e) }
  }, 60000); // check every 1 min
})();
</script>
