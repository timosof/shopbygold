<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - ShopByGold</title>
    <link href="output.css" rel="stylesheet">
    <link href="mobile.css" rel="stylesheet">

    <!-- favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" href="/favicon.svg">
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-lg shadow-md w-96">
        <h1 class="text-2xl font-bold mb-6 text-center text-yellow-600">Join ShopByGold</h1>

        <div id="error" class="hidden bg-red-100 text-red-700 p-3 rounded mb-4"></div>
        <div id="success" class="hidden bg-green-100 text-green-700 p-3 rounded mb-4"></div>

        <form id="registerForm">
            <div class="mb-4">
                <label class="block text-gray-700 mb-2">Name</label>
                <input type="text" id="username" class="w-full p-2 border rounded" required>
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 mb-2">Email</label>
                <input type="email" id="email" class="w-full p-2 border rounded" required>
            </div>
            <div class="mb-6">
                <label class="block text-gray-700 mb-2">Password</label>
                <input type="password" id="password" class="w-full p-2 border rounded" required>
            </div>
            <button type="submit" class="w-full bg-yellow-500 text-white p-2 rounded hover:bg-yellow-600">
                Create Account
            </button>
        </form>

        <p class="text-center mt-4 text-gray-600">
            Already have an account? <a href="login.html" class="text-yellow-600 hover:underline">Login</a>
        </p>
    </div>

    <script>
        const form = document.getElementById('registerForm');
        const errorDiv = document.getElementById('error');
        const successDiv = document.getElementById('success');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorDiv.classList.add('hidden');
            successDiv.classList.add('hidden');

            const username = document.getElementById('username').value; 
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password }) 
                });

                const data = await res.json();

                if (res.ok) {
                    // FIXED: Backend returns access_token, not token
                    localStorage.setItem('token', data.access_token); 
                    localStorage.setItem('user', JSON.stringify(data.user));
                    localStorage.setItem('username', data.user.username);
                    localStorage.setItem('user_role', data.user.role);
                    localStorage.setItem('user_id', data.user.id); 

                    successDiv.textContent = 'Account created! Redirecting...';
                    successDiv.classList.remove('hidden');
                    // CHANGED: Go to shop, not login - user is already logged in
                    setTimeout(() => window.location.href = 'shop.html', 1500);
                } else {
                    errorDiv.textContent = data.msg || 'Registration failed';
                    errorDiv.classList.remove('hidden');
                }
            } catch (err) {
                errorDiv.textContent = 'Server error. Please try again later.';
                errorDiv.classList.remove('hidden');
            }
        });
    </script>
</body>

</html>
