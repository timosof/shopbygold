<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - ShopByGold</title>
    <link href="output.css" rel="stylesheet">
    <link href="mobile.css" rel="stylesheet">

    <!-- favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" href="/favicon.svg">
</head>
<body class="bg-gray-50">
    <div class="min-h-screen flex items-center justify-center px-4">
        <div class="max-w-md w-full bg-white p-8 rounded-lg shadow-md">
            <h1 class="text-2xl font-bold text-center mb-6">Reset Password</h1>
            
            <form id="reset-form">
                <input type="password" id="password" placeholder="New Password" 
                       class="w-full border rounded px-3 py-2 mb-4" required minlength="6">
                <input type="password" id="confirm-password" placeholder="Confirm Password" 
                       class="w-full border rounded px-3 py-2 mb-4" required>
                <button type="submit" 
                        class="w-full bg-yellow-500 text-white py-2 rounded hover:bg-yellow-600">
                    Reset Password
                </button>
            </form>
            
            <div id="message" class="mt-4 text-center text-sm"></div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        
        if (!token) {
            document.getElementById('message').textContent = 'Invalid reset link';
            document.getElementById('message').className = 'mt-4 text-center text-sm text-red-600';
            document.getElementById('reset-form').style.display = 'none';
        }
        
        document.getElementById('reset-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm-password').value;
            const msgDiv = document.getElementById('message');
            
            if (password !== confirm) {
                msgDiv.textContent = 'Passwords do not match';
                msgDiv.className = 'mt-4 text-center text-sm text-red-600';
                return;
            }
            
            msgDiv.textContent = 'Resetting...';
            msgDiv.className = 'mt-4 text-center text-sm text-gray-600';
            
            try {
                const res = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password })
                });
                
                const data = await res.json();
                
                if (res.ok) {
                    msgDiv.textContent = data.msg + ' Redirecting to login...';
                    msgDiv.className = 'mt-4 text-center text-sm text-green-600';
                    setTimeout(() => window.location.href = 'login.html', 2000);
                } else {
                    msgDiv.textContent = data.msg;
                    msgDiv.className = 'mt-4 text-center text-sm text-red-600';
                }
                
            } catch (err) {
                msgDiv.textContent = 'Something went wrong. Try again.';
                msgDiv.className = 'mt-4 text-center text-sm text-red-600';
            }
        });
    </script>
</body>
</html>
