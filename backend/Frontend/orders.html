<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - ShopByGold</title>
    <link href="output.css" rel="stylesheet">
    <link href="mobile.css" rel="stylesheet">

    <!-- favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" href="/favicon.svg">
</head>

<body class="bg-gray-50">
    <nav class="bg-white shadow-md p-4 sticky top-0 z-10">
        <div class="max-w-6xl mx-auto flex justify-between items-center gap-2">
            <!-- Logo smaller on mobile -->
            <a href="shop.html" class="text-2xl font-bold text-yellow-600 flex-shrink-0" id="nav-logo">ShopByGold</a>

            <!-- Search - shows on all screens, small on mobile -->
            <div class="flex-1 max-w-xs md:max-w-md mx-2">
                <input id="nav-search-input" type="text" placeholder="Search..."
                    class="w-full border rounded-full px-3 py-3 text-sm bg-gray-100 focus:bg-white focus:outline-none focus:ring-2 focus:ring-yellow-500">
            </div>

            <!-- Desktop Links -->
            <div id="desktop-links" class="flex gap-6 items-center">
                <a href="shop.html" class="text-yellow-600 font-semibold">Shop</a>
                <!-- <a id="ordersLink" href="orders.html" class="hidden text-gray-700 hover:text-yellow-600">My Orders</a> -->
                <a id="adminLink" href="admin.html" class="hidden text-blue-600 hover:underline">Admin</a>
                <a id="loginLink" href="login.html" class="text-gray-700 hover:text-yellow-600">Login</a>
                <a id="registerLink" href="register.html"
                    class="hidden text-gray-700 hover:text-yellow-600">Register</a>
                <span id="username" class="hidden text-gray-700"></span>
                <button id="logoutBtn" onclick="logout()" class="hidden text-red-500 hover:underline">Logout</button>
                <a href="cart.html" class="relative">🛒<span id="cart-count"
                        class="absolute -top-2 -right-2 bg-red-500 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center">0</span></a>
            </div>

            <!-- Hamburger - mobile only -->
            <button id="hamburger-btn"
                class="hidden text-2xl bg-gray-100 rounded-full w-9 h-9 flex items-center justify-center">☰</button>
        </div>

        <!-- MOBILE MENU - links downward -->
        <div id="mobile-menu" class="hidden bg-white border-t shadow-lg absolute left-0 top-full w-full p-4 z-50">
            <a href="shop.html" class="py-3 border-b">Shop</a>
            <a id="m-adminLink" href="admin.html" class="hidden py-3 border-b text-blue-600">Admin</a>
            <a href="cart.html" class="py-3 border-b">Cart</a>
            <a id="m-loginLink" href="login.html" class="py-3 border-b">Login</a>
            <a id="m-registerLink" href="register.html" class="hidden py-3 border-b">Register</a>
            <span id="m-username" class="hidden py-3 border-b font-semibold"></span>
            <button id="m-logoutBtn" onclick="logout()" class="hidden py-3 text-left text-red-500">Logout</button>
        </div>
    </nav>

    <div class="max-w-6xl mx-auto mt-8 px-4 pb-10">
        <h1 class="text-3xl font-bold mb-8">My Orders</h1>
        <div id="loading" class="text-center py-20 text-gray-500">Loading orders...</div>
        <div id="orders-list"></div>
    </div>

    <script src="js/navbar.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = 'login.html';
                return;
            }
            loadMyOrders();
        });

        async function loadMyOrders() {
            const token = localStorage.getItem('token');
            const loading = document.getElementById('loading');
            const ordersDiv = document.getElementById('orders-list');

            try {
                const res = await fetch('/api/orders/my-orders', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                loading.classList.add('hidden');
                if (!res.ok) throw new Error('Failed to load orders');

                const orders = await res.json();

                if (orders.length === 0) {
                    ordersDiv.innerHTML = '<p class="text-center text-gray-500 py-10">You have no orders yet. <a href="shop.html" class="text-yellow-600 hover:underline">Start shopping</a></p>';
                    return;
                }

                ordersDiv.innerHTML = orders.map(function (order) {
                    return '<div class="bg-white p-6 rounded-lg shadow-md mb-4">' +
                        '<div class="flex justify-between items-start mb-4">' +
                        '<div>' +
                        '<h3 class="font-bold text-xl">Order #' + order.id + '</h3>' +
                        '<p class="text-sm text-gray-500">' + (function(){ try{ if(!order.created_at) return 'N/A'; var d=new Date(order.created_at); return isNaN(d.getTime()) ? 'N/A' : d.toLocaleDateString('en-GB'); }catch(e){ return 'N/A'; } })() + '</p>' +
                        '</div>' +
                        '<span class="px-3 py-1 rounded text-sm font-semibold ' +
                        (order.status === 'delivered' ? 'bg-green-100 text-green-700' : order.status === 'shipped' ? 'bg-blue-100 text-blue-700' : order.status === 'paid' ? 'bg-purple-100 text-purple-700' : order.status === 'cancelled' ? 'bg-red-100 text-red-700' : 'bg-yellow-100 text-yellow-700') + '">' +
                        order.status.toUpperCase() +
                        '</span>' +
                        '</div>' +
                        '<div class="grid md:grid-cols-2 gap-4 mb-4">' +
                        '<div>' +
                        '<p class="mb-1"><b>Total:</b> NGN ' + order.total.toFixed(2) + '</p>' +
                        '<p class="mb-1"><b>Payment Ref:</b> ' + (order.payment_reference || 'N/A') + '</p>' +
                        '</div>' +
                        '<div>' +
                        '<p class="font-semibold mb-2">Delivery Details:</p>' +
                        (order.customer_name ?
                            '<p class="text-sm"><b>Name:</b> ' + order.customer_name + '</p>' +
                            '<p class="text-sm"><b>Phone:</b> ' + (order.customer_phone || 'N/A') + '</p>' +
                            '<p class="text-sm"><b>Address:</b> ' + (order.customer_address || 'N/A') + '</p>' +
                            '<p class="text-sm"><b>State:</b> ' + (order.delivery_state || 'Not set') + '</p>' +
                            '<p class="text-sm"><b>Delivery Fee:</b> NGN ' + (order.delivery_fee || 0).toFixed(2) + '</p>'
                            :
                            '<p class="text-sm">' + (order.shipping_address || 'N/A') + '</p>'
                        ) +
                        '</div>' +
                        '</div>' +
                        '<details class="cursor-pointer">' +
                        '<summary class="font-semibold text-yellow-600 hover:underline">View Items (' + order.items.length + ')</summary>' +
                        '<ul class="mt-3 ml-4 space-y-2">' +
                        order.items.map(function (item) {
                            return '<li class="text-sm bg-gray-50 p-3 rounded flex justify-between items-center">' +
                                '<div><span class="font-medium">' + item.product_name + '</span><span class="text-gray-500"> x ' + item.quantity + '</span></div>' +
                                '<div class="text-right"><div class="text-xs text-gray-500">NGN ' + item.price.toFixed(2) + ' each</div><div class="font-semibold">NGN ' + (item.price * item.quantity).toFixed(2) + '</div></div>' +
                                '</li>';
                        }).join('') +
                        '</ul>' +
                        '</details>' +
                        '</div>';
                }).join('');

            } catch (err) {
                console.error(err);
                loading.textContent = 'Failed to load orders';
            }
        }

        document.getElementById('hamburger-btn').onclick = () => {
            document.getElementById('mobile-menu').classList.toggle('hidden');
            document.getElementById('mobile-menu').classList.toggle('flex-col');
        }
        document.getElementById('nav-search-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') { const q = e.target.value.trim(); window.location.href = q ? 'shop.html?search=' + encodeURIComponent(q) : 'shop.html'; }
        });
    </script>
</body>

</html>
