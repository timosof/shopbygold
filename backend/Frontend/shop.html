    <style>
        @media(min-width:640px) {
            #products-grid {
                grid-template-columns: repeat(3, 1fr) !important
            }
        }

        @media(min-width:768px) {
            #products-grid {
                grid-template-columns: repeat(4, 1fr) !important
            }
        }

        @media(min-width:1024px) {
            #products-grid {
                grid-template-columns: repeat(6, 1fr) !important
            }
        }

        .cat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
            padding: 12px 16px;
            border: none;
            border-radius: 8px 8px 0 0;
        }

        .cat-title {
            font-weight: 700;
            font-size: 15px;
            text-transform: uppercase
        }

        .cat-row {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            scroll-behavior: smooth;
            padding: 12px;
            background: #fff;
            border: none;
            border-radius: 0 0 8px 8px
        }

        .cat-row::-webkit-scrollbar {
            display: none
        }

        .cat-card {
            min-width: 165px;
            max-width: 165px;
            background: #fff;
            border: none;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            flex-shrink: 0;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06)
        }

        .main-grid {
            display: grid;
            grid-template-columns: 220px 1fr 240px;
            gap: 16px;
            max-width: 1280px;
            margin: 20px auto;
            padding: 0 16px
        }

        .left-cat {
            background: #fff;
            border-radius: 12px;
            padding: 8px
        }

        .left-cat a {
            display: flex;
            gap: 10px;
            padding: 12px;
            font-size: 13px;
            border-bottom: 1px solid #f3f4f6;
            text-decoration: none;
            color: #333
        }

        .right-contact {
            display: flex;
            flex-direction: column;
            gap: 12px
        }

        .r-box {
            background: #fff;
            border-radius: 12px;
            padding: 16px
        }

        @media(max-width:1023px) {
            .main-grid {
                grid-template-columns: 1fr
            }
        }

        .side-wrapper .side-cat {
            display: block
        }

        .side-wrapper .side-contact {
            display: flex;
            flex-direction: column;
            gap: 12px
        }

        /* HIDE ON MOBILE - ONLY SHOW ON DESKTOP */
        @media(max-width:1023px) {
            .side-wrapper {
                grid-template-columns: 1fr !important
            }

            .side-wrapper .side-cat {
                display: none !important
            }

            .side-wrapper .side-contact {
                display: none !important
            }
        }
    </style>

    <script>
        // loads products from backend, handles search query if present

        function getImageUrl(url) {
            if (!url) return 'https://via.placeholder.com/300';
            if (url.startsWith('http')) return url; // Cloudinary - use directly
            // Old local uploads - will work locally, but will break on Koyeb anyway
            return url;
        }
        async function loadProducts() {
            try {
                const params = new URLSearchParams(window.location.search);
                const q = params.get('search');
                const url = q ? '/api/products/search?q=' + encodeURIComponent(q) : '/api/products/';
                const res = await fetch(url);
                const products = await res.json();
                const loading = document.getElementById('loading');
                const grid = document.getElementById('products-grid');
                const catContainer = document.getElementById('categories-container');
                loading.style.display = 'none';
                if (products.length === 0) { catContainer.innerHTML = `<div class="text-center py-20">No products found</div>`; return; }
                if (q) {
                    catContainer.style.display = 'none'; grid.style.display = 'grid';
                    grid.innerHTML = products.map(function (p) { return '<div onclick="window.location.href=\'product.html?id=' + p.id + '\'" style="background:white; border:1px solid #eee; border-radius:8px; overflow:hidden; cursor:pointer; display:flex; flex-direction:column"><div style="height:190px; background:white; display:flex; align-items:center; justify-content:center; padding:6px"><img src="' + getImageUrl(p.image_url) + '" style="max-width:100%; max-height:100%; object-fit:contain"></div><div style="padding:8px 10px; border-top:1px solid #f3f4f6"><div style="font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis">' + p.name + '</div><div style="font-size:11px; color:#999; margin-top:2px">Stock: ' + p.stock + '</div><div style="font-size:13px; font-weight:700; color:#555; margin-top:3px">NGN ' + Number(p.price).toLocaleString() + '</div></div></div>'; }).join(''); return;
                }
                grid.style.display = 'none'; catContainer.style.display = 'block';
                const groups = {}; products.forEach(p => { let cat = (p.category || 'general').trim().toLowerCase(); if (!groups[cat]) groups[cat] = []; groups[cat].push(p); });
                catContainer.innerHTML = Object.keys(groups).map(catKey => { const displayName = catKey.charAt(0).toUpperCase() + catKey.slice(1); return `<div class="cat-section"><div class="cat-header"><span class="cat-title">${displayName}</span><a href="shop.html?search=${encodeURIComponent(catKey)}" style="color:#f68b1e; font-size:13px; font-weight:700; text-decoration:none">See All ></a></div><div class="cat-row">${groups[catKey].map(p => `<div class="cat-card" onclick="window.location.href='product.html?id=${p.id}'"><div style="height:165px; background:white; display:flex; align-items:center; justify-content:center; padding:8px"><img src="${getImageUrl(p.image_url)}" style="max-width:100%; max-height:100%; object-fit:contain"></div><div style="padding:8px 10px; border-top:1px solid #f3f4f6"><div style="font-size:12px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis">${p.name}</div><div style="font-size:12px; font-weight:700; color:#333; margin-top:4px">NGN ${Number(p.price).toLocaleString()}</div></div></div>`).join('')}</div></div>`; }).join('');
            } catch (err) { document.getElementById('loading').textContent = 'Oops! Something went wrong.'; console.error(err); }
        }


        // handles adding product to cart with specified quantity
        async function handleAdd(productId) {
            const qtyInput = document.getElementById('qty-' + productId);
            const qty = parseInt(qtyInput.value) || 1;

            // 1. Block sold out on frontend
            if (qtyInput.max == 0) {
                alert('This item is sold out');
                return;
            }

            const token = localStorage.getItem('token');
            if (!token) {
                alert('Please login first');
                window.location.href = 'login.html';
                return;
            }

            const res = await fetch('/api/cart/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                body: JSON.stringify({ product_id: productId, quantity: qty })
            });

            const data = await res.json();

            // 2. Show backend error (Sold out / Only 2 left)
            if (!res.ok) {
                alert(data.msg || 'Failed to add');
                return;
            }

            updateCartCount();
            alert('Added to cart!');
        }

        loadProducts();

        document.getElementById('hamburger-btn').onclick = () => {
            document.getElementById('mobile-menu').classList.toggle('hidden');
            document.getElementById('mobile-menu').classList.toggle('flex-col');
        }
        document.getElementById('nav-search-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') { const q = e.target.value.trim(); window.location.href = q ? 'shop.html?search=' + encodeURIComponent(q) : 'shop.html'; }
        });


        let currentIndex = 0;
        let autoSlide;
        async function loadSliders() {
            try {
                const res = await fetch('/api/sliders');
                const sliders = await res.json();
                console.log("SLIDERS FROM API:", sliders); // CHECK THIS IN F12 CONSOLE

                if (!sliders || sliders.length === 0 || sliders[0].id === 0 && !sliders[0].image_url) {
                    // No real sliders yet - show default welcome
                    document.getElementById('heroSlider').innerHTML = `
        <div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff8e7">
          <h2 style="font-size:28px;font-weight:700">Welcome to ShopByGold</h2>
          <p>Let Get The Shopping Started!</p>
        </div>`;
                    document.getElementById('heroSlider').style.display = 'block';
                    return;
                }

                document.getElementById('heroSlider').style.display = 'block';
                const slidesEl = document.getElementById('slides');
                const dotsEl = document.getElementById('dots');

                slidesEl.innerHTML = sliders.map(s => `
      <div class="slide">
        <img src="${s.image_url}" alt="${s.title}" onerror="console.error('FAILED TO LOAD:', this.src); this.style.border='3px solid red'">
        <div class="slide-content">
          <h2 style="font-size:24px;font-weight:700">${s.title}</h2>
          <p>${s.subtitle || ''}</p>
          ${s.link ? `<a href="${s.link}" style="display:inline-block;margin-top:8px;background:#000;color:#fff;padding:6px 14px;border-radius:6px;text-decoration:none">Shop Now</a>` : ''}
        </div>
      </div>
    `).join('');

                dotsEl.innerHTML = sliders.map((_, i) => `<div class="dot ${i === 0 ? 'active' : ''}" onclick="goToSlide(${i})"></div>`).join('');
                startAutoSlide();
            } catch (e) { console.error("Slider load failed", e); }
        }
        function updateSlider() {
            document.getElementById('slides').style.transform = `translateX(-${currentIndex * 100}%)`;
            document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === currentIndex));
        }
        function moveSlide(dir) {
            const total = document.querySelectorAll('.slide').length;
            if (!total) return;
            currentIndex = (currentIndex + dir + total) % total;
            updateSlider();
        }
        function goToSlide(i) { currentIndex = i; updateSlider(); }
        function startAutoSlide() {
            clearInterval(autoSlide);
            autoSlide = setInterval(() => moveSlide(1), 4000);
        }
        loadSliders();

    </script>

    <button id="ai-chat-btn">💬</button>

    <div id="ai-chat-box">
        <div id="ai-chat-header">Shop Assistant</div>
        <div id="ai-chat-messages">
            Hi! How can I help you today?
        </div>
        <div id="ai-chat-input-area">
            <input id="ai-chat-input" placeholder="Type message..." />
            <button id="ai-chat-send"
                style="background:rgb(0, 0, 0);color:white;border:none;padding:8px 12px;border-radius:8px;margin-left:6px;cursor:pointer;">Send</button>
        </div>
    </div>

    <script>
        const chatBtn = document.getElementById('ai-chat-btn');
        const chatBox = document.getElementById('ai-chat-box');
        const messagesDiv = document.getElementById('ai-chat-messages');
        const chatInput = document.getElementById('ai-chat-input');
        const chatSendBtn = document.getElementById('ai-chat-send');

        chatBtn.onclick = () => {
            chatBox.style.display = chatBox.style.display === 'flex' ? 'none' : 'flex';
        }

        async function getToken() {
            return localStorage.getItem('access_token') || localStorage.getItem('token') || localStorage.getItem('jwt') || sessionStorage.getItem('access_token') || '';
        }

        async function sendChat() {
            const text = chatInput.value.trim();
            if (!text) return;
            messagesDiv.innerHTML += `<div style="background:black;color:white;padding:8px 12px;border-radius:12px;margin:8px 0;margin-left:auto;max-width:80%;width:fit-content;">${text}</div>`;
            chatInput.value = '';

            let cart = JSON.parse(localStorage.getItem('cart') || localStorage.getItem('cartItems') || '[]');
            let token = await getToken();
            const headers = { 'Content-Type': 'application/json' };
            if (token) headers['Authorization'] = 'Bearer ' + token;

            const res = await fetch('/api/ai-chat', {
                method: 'POST',
                headers: headers,
                body: JSON.stringify({ message: text, cart: cart })
            });
            const data = await res.json();

            messagesDiv.innerHTML += `<div style="background:#f1f1f1;padding:8px 12px;border-radius:12px;margin:8px 0;max-width:80%;width:fit-content;">${data.reply}</div>`;
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        chatSendBtn.onclick = sendChat;
        chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendChat(); });

        // --- AUTO POPUP FOR LOGGED IN USERS ---
        setInterval(async () => {
            try {
                let token = await getToken();
                const headers = { 'Content-Type': 'application/json' };
                if (token) headers['Authorization'] = 'Bearer ' + token;

                const res = await fetch('/api/ai-cart/check', {
                    method: 'POST',
                    headers: headers
                });
                const data = await res.json();
                console.log("Check abandoned:", data);
                if (data.abandoned) {
                    chatBox.style.display = 'flex';
                    messagesDiv.innerHTML += `<div style="background:#f1f1f1;padding:10px 12px;border-radius:12px;margin:8px 0;max-width:85%;">${data.message}<br><br><button onclick="window.location.href='/checkout.html'" style="background:black;color:white;border:none;padding:8px 14px;border-radius:8px;cursor:pointer;">Checkout Now</button></div>`;
                    messagesDiv.scrollTop = messagesDiv.scrollHeight;
                }
            } catch (e) { console.log(e) }
        }, 60000); // check every 1 minute for testing
    </script>
