<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - ShopByGold</title>
    <link href="output.css" rel="stylesheet">
    <link href="mobile.css" rel="stylesheet">

    <!-- favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" href="/favicon.svg">
</head>

<body class="bg-gray-50">
    <div class="flex items-center justify-center min-h-screen">
        <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
            <h2 class="text-2xl font-bold mb-6 text-center">Forgot Password</h2>
            <form id="forgot-form" class="space-y-4">
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700">Email Address</label>
                    <input type="email" id="email" name="email" required
                        class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-yellow-500 focus:border-yellow-500 sm:text-sm">
                </div>
                <button type="submit"
                    class="w-full bg-yellow-500 text-white py-2 px-4 rounded hover:bg-yellow-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-yellow-500">
                    Send Reset Link
                </button>
            </form>
            <div id="message" class="mt-4 text-center text-sm text-gray-600"></div>
        </div>

        <script>
            document.getElementById('forgot-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('email').value;
                const msgDiv = document.getElementById('message');

                msgDiv.textContent = 'Sending...';
                msgDiv.className = 'mt-4 text-center text-sm text-gray-600';

                try {
                    const res = await fetch('/api/auth/forgot-password', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email })
                    });

                    const data = await res.json();
                    msgDiv.textContent = data.msg;
                    msgDiv.className = 'mt-4 text-center text-sm text-green-600';

                } catch (err) {
                    msgDiv.textContent = 'Something went wrong. Try again.';
                    msgDiv.className = 'mt-4 text-center text-sm text-red-600';
                }
            });
        </script>
</body>

</html>
